<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>预支 · 封面 4:5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- 《预支》竖版封面 1080×1350（4:5）。用 Chrome 打开即可，截图或用渲染脚本导出 PNG。 -->
<style>
html,body{margin:0;background:#000}
#c{position:relative;width:1080px;height:1350px;overflow:hidden;background:#050505}
#c canvas{position:absolute;left:0;top:0;width:1080px;height:1350px}
.t{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;font-family:'Noto Serif SC',serif;font-weight:700;color:#F2F2F2}
.red{color:#E5484D;text-shadow:0 0 18px rgba(229,72,77,.95),0 0 50px rgba(229,72,77,.65),0 0 110px rgba(229,72,77,.35)}
#ts{position:absolute;left:72px;top:78px;font:400 36px 'JetBrains Mono','Noto Sans SC',monospace;color:#BDBDBD}
#sub{position:absolute;left:0;width:1080px;top:1046px;text-align:center;font:500 42px 'Noto Sans SC',sans-serif;letter-spacing:.06em;color:#F2F2F2}
#sub b{color:#E8C27A;font-weight:500;text-shadow:0 0 14px rgba(232,194,122,.7)}
#tag{position:absolute;left:0;width:1080px;top:1190px;text-align:center;font:400 30px 'Noto Sans SC',sans-serif;letter-spacing:.5em;color:rgba(242,242,242,.6)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 52%,rgba(0,0,0,0) 45%,rgba(0,0,0,.35) 75%,rgba(0,0,0,.7) 100%)}
#rv{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 52%,rgba(110,6,12,0) 50%,rgba(110,6,12,.28) 85%,rgba(140,10,18,.45) 100%)}
</style>
</head>
<body>
<div id="c">
  <canvas id="bg" width="2160" height="2700"></canvas>
  <div id="rv"></div>
  <div id="ts">周日 23:41</div>
  <div class="t" style="top:378px;font-size:84px;line-height:84px;color:rgba(242,242,242,.88)">事情还没发生，</div>
  <div class="t" style="top:528px;font-size:124px;line-height:124px">你已经痛过</div>
  <div class="t" style="top:700px;font-size:124px;line-height:190px"><span class="red" style="font-size:190px">一百遍</span>了。</div>
  <div id="sub">你担心的事，<b>91%</b>从来没有发生</div>
  <div id="tag">《预支》</div>
  <canvas id="grain" width="540" height="675" style="opacity:.05"></canvas>
  <div id="vig"></div>
</div>
<script>
(function () {
  const W = 1080, H = 1350, K = 2;
  const ctx = document.getElementById('bg').getContext('2d');
  ctx.scale(K, K);
  let a = 20240607;
  const R = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const O = [430, 795];                                    // 裂纹从“一百遍”炸出
  // 红色光晕
  let g = ctx.createRadialGradient(O[0], O[1], 0, O[0], O[1], 620);
  g.addColorStop(0, 'rgba(229,72,77,.32)'); g.addColorStop(.35, 'rgba(229,72,77,.1)'); g.addColorStop(1, 'rgba(229,72,77,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 心跳扩散环
  for (let i = 0; i < 3; i++) { ctx.strokeStyle = `rgba(229,72,77,${.12 - i * .035})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(O[0], O[1], 260 + i * 170, 0, Math.PI * 2); ctx.stroke(); }
  // 裂纹：折线 + 支线 + 末端红光
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'lighter';
  const tips = [];
  for (let i = 0; i < 38; i++) {
    const ang0 = i / 38 * Math.PI * 2 + (R() - .5) * .12;
    let x = O[0], y = O[1];
    const pts = [[x, y]];
    const n = 3 + (R() * 4 | 0);
    for (let k = 0; k < n; k++) { const ang = ang0 + (R() - .5) * .8, l = k === n - 1 ? 900 : 90 + R() * 180; x += Math.cos(ang) * l; y += Math.sin(ang) * l; pts.push([x, y]); }
    const al = .25 + R() * .35;
    ctx.strokeStyle = `rgba(240,80,84,${al})`; ctx.shadowColor = '#E5484D'; ctx.shadowBlur = 10; ctx.lineWidth = 1.3;
    ctx.beginPath(); pts.forEach((p, j) => j ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    if (R() < .55) {
      const s = pts[1 + (R() * (pts.length - 2) | 0)]; let bx = s[0], by = s[1], ba = ang0 + (R() < .5 ? -1 : 1) * (.5 + R() * .5);
      ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(bx, by);
      for (let k = 0; k < 3; k++) { ba += (R() - .5) * .6; bx += Math.cos(ba) * (50 + R() * 70); by += Math.sin(ba) * (50 + R() * 70); ctx.lineTo(bx, by); }
      ctx.stroke(); tips.push([bx, by]);
    }
    // 火星
    for (let k = 0; k < 4; k++) { const p = pts[1 + (R() * (pts.length - 1) | 0)]; const sx = p[0] + (R() - .5) * 40, sy = p[1] + (R() - .5) * 40, sa = R() * Math.PI * 2, sl = 6 + R() * 16; ctx.strokeStyle = `rgba(255,${150 + R() * 80 | 0},120,${.4 + R() * .5})`; ctx.lineWidth = 1.4; ctx.shadowBlur = 6; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(sa) * sl, sy + Math.sin(sa) * sl); ctx.stroke(); }
  }
  ctx.shadowBlur = 0;
  for (const [x, y] of tips) { const gg = ctx.createRadialGradient(x, y, 0, x, y, 14); gg.addColorStop(0, 'rgba(229,72,77,.7)'); gg.addColorStop(1, 'rgba(229,72,77,0)'); ctx.fillStyle = gg; ctx.fillRect(x - 14, y - 14, 28, 28); }
  // 文字后面压暗，保证可读
  ctx.globalCompositeOperation = 'source-over';
  g = ctx.createRadialGradient(540, 640, 0, 540, 640, 420);
  g.addColorStop(0, 'rgba(5,5,5,.55)'); g.addColorStop(1, 'rgba(5,5,5,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 微尘
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 160; i++) { const x = R() * W, y = R() * H, r = .6 + R() * 1.8; ctx.fillStyle = `rgba(200,200,205,${.08 + R() * .28})`; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  // 金色细线（标题与片名之间）
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = 'rgba(232,194,122,.8)'; ctx.lineWidth = 1.2; ctx.shadowColor = '#E8C27A'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(540 - 150, 1150); ctx.lineTo(540 + 150, 1150); ctx.stroke();
  // 胶片噪点
  const gc = document.getElementById('grain').getContext('2d'), id = gc.createImageData(540, 675);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255 | 0; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gc.putImageData(id, 0, 0);
  document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
})();
</script>
</body>
</html>
