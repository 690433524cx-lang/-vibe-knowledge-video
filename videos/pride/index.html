<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>七宗罪·傲慢</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
// 《七宗罪·傲慢》——画面完全由 render(t) 决定；所有“随机”都来自 hash(i)。

// ============================================================ 基础 ============
const W = 1920, H = 1080, FPS = 30, TAU = Math.PI * 2, D2R = Math.PI / 180;
const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
let T = 0; // 当前帧时间，只在 render(t) 开头赋值

const SERIF = '"Noto Serif CJK SC", serif';
const SANS = '"Noto Sans CJK SC", sans-serif';
const MONO = '"DejaVu Sans Mono", monospace';
const fs = (w, s) => `${w} ${s}px ${SERIF}`;
const fsans = (w, s) => `${w} ${s}px ${SANS}`;
const fm = (w, s) => `${w} ${s}px ${MONO}`;

const C = {
  gold: '#E8C27A', goldHi: '#FFF1C9', goldLo: '#9C6A30',
  blue: '#2F4FA2', blueHi: '#5B7BD0',
  red: '#C8322B', redHi: '#E5484D',
  green: '#1F7A5C', greenHi: '#3FAE86',
  paper: '#F2E6CC', muted: '#B9A88C', ink: '#1A120A',
  bg: '#2A1D12', vellum: '#E9D9B8', bark: '#4A2E18', figure: '#8A7354',
};

// ------------------------------------------------------------ 数学与缓动
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, k) => a + (b - a) * k;
const fract = x => x - Math.floor(x);
const mod = (x, m) => ((x % m) + m) % m;
const hash = i => fract(Math.sin(i * 127.1 + 311.7) * 43758.5453);
const prog = (t, a, b) => (b <= a ? (t >= b ? 1 : 0) : clamp((t - a) / (b - a)));
const out3 = x => 1 - Math.pow(1 - x, 3);
const in2 = x => x * x;
const inOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outExpo = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const sine = x => -(Math.cos(Math.PI * x) - 1) / 2;
const outBack = x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
// 元素在 [a,b] 窗口内的可见度（带缓动的淡入淡出）
function vis(t, a, b, fi = 0.5, fo = 0.5) {
  if (t < a || t > b) return 0;
  const i = fi > 0 ? sine(prog(t, a, a + fi)) : 1;
  const o = fo > 0 ? 1 - sine(prog(t, b - fo, b)) : 1;
  return Math.min(i, o);
}

// ------------------------------------------------------------ 颜色
const _rgb = new Map();
function hexRgb(h) {
  let v = _rgb.get(h);
  if (!v) { const n = parseInt(h.slice(1), 16); v = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; _rgb.set(h, v); }
  return v;
}
function mix(a, b, k) {
  const A = hexRgb(a), B = hexRgb(b);
  return `rgb(${Math.round(lerp(A[0], B[0], k))},${Math.round(lerp(A[1], B[1], k))},${Math.round(lerp(A[2], B[2], k))})`;
}
function rgba(h, a) { const A = hexRgb(h); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; }

function goldGrad(y0, y1, c = ctx) {
  const g = c.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, '#FFF4D6'); g.addColorStop(0.5, '#EBC67E'); g.addColorStop(1, '#9C6A30');
  return g;
}

// ------------------------------------------------------------ 几何小工具
function bez(P0, P1, P2, P3, s) {
  const u = 1 - s;
  return [
    u * u * u * P0[0] + 3 * u * u * s * P1[0] + 3 * u * s * s * P2[0] + s * s * s * P3[0],
    u * u * u * P0[1] + 3 * u * u * s * P1[1] + 3 * u * s * s * P2[1] + s * s * s * P3[1],
  ];
}
function quad(P0, P1, P2, s) {
  const u = 1 - s;
  return [u * u * P0[0] + 2 * u * s * P1[0] + s * s * P2[0], u * u * P0[1] + 2 * u * s * P1[1] + s * s * P2[1]];
}
function quadTan(P0, P1, P2, s) {
  const x = 2 * (1 - s) * (P1[0] - P0[0]) + 2 * s * (P2[0] - P1[0]);
  const y = 2 * (1 - s) * (P1[1] - P0[1]) + 2 * s * (P2[1] - P1[1]);
  const l = Math.hypot(x, y) || 1;
  return [x / l, y / l];
}
// 末端卷成小螺旋的藤蔓：返回折线点
function makeVine(P0, P1, P2, P3, r0, sign, turns = 1.7) {
  const pts = [];
  for (let k = 0; k <= 28; k++) pts.push(bez(P0, P1, P2, P3, k / 28));
  const e = pts[pts.length - 1], p = pts[pts.length - 2];
  const tl = Math.hypot(e[0] - p[0], e[1] - p[1]) || 1;
  const tx = (e[0] - p[0]) / tl, ty = (e[1] - p[1]) / tl;
  const nx = -ty * sign, ny = tx * sign;
  const cx = e[0] + nx * r0, cy = e[1] + ny * r0;
  const a0 = Math.atan2(e[1] - cy, e[0] - cx);
  for (let k = 1; k <= 22; k++) {
    const f = k / 22, a = a0 + sign * f * turns * Math.PI, r = r0 * (1 - 0.72 * f);
    pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  return { pts, P: [P0, P1, P2, P3] };
}
function strokePartial(pts, g) {
  if (g <= 0) return;
  const n = pts.length - 1, f = g * n, k = Math.floor(f);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i <= Math.min(k, n); i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (k < n) { const a = pts[k], b = pts[k + 1], r = f - k; ctx.lineTo(lerp(a[0], b[0], r), lerp(a[1], b[1], r)); }
  ctx.stroke();
}
function leafShape(x, y, ang, len, wid) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.5, -wid, len, 0);
  ctx.quadraticCurveTo(len * 0.5, wid, 0, 0);
  ctx.restore();
}

// ============================================================ 预生成资源 =======
// 1) 羊皮纸纹理 960×540
const tex = document.createElement('canvas'); tex.width = 960; tex.height = 540;
(function () {
  const c = tex.getContext('2d');
  for (let i = 0; i < 60; i++) {
    const x = hash(i * 3.1 + 101) * 960, y = hash(i * 5.7 + 202) * 540;
    const r = 20 + 100 * hash(i * 7.3 + 303), a = 0.03 + 0.05 * hash(i * 9.1 + 404);
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(26,16,8,${a})`); g.addColorStop(1, 'rgba(26,16,8,0)');
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  c.lineWidth = 0.6; c.lineCap = 'round';
  for (let i = 0; i < 1500; i++) {
    const x = hash(i * 1.37 + 11) * 960, y = hash(i * 2.71 + 23) * 540;
    const l = 6 + 24 * hash(i * 3.93 + 37), a = hash(i * 5.17 + 41) * Math.PI;
    c.strokeStyle = mix('#4A3420', '#1A110A', hash(i * 6.61 + 53));
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
  }
})();
// 2) 胶片噪点 4 张 480×270
const noise = [0, 1, 2, 3].map(k => {
  const c = document.createElement('canvas'); c.width = 480; c.height = 270;
  const x = c.getContext('2d'), im = x.createImageData(480, 270);
  for (let i = 0; i < 480 * 270; i++) {
    const v = (hash(i * 0.7310 + k * 977.31 + 0.5) * 255) | 0;
    im.data[i * 4] = v; im.data[i * 4 + 1] = v; im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255;
  }
  x.putImageData(im, 0, 0);
  return c;
});
// 3) 金色光点贴图（确定性，非随机）
const glowSprite = document.createElement('canvas'); glowSprite.width = glowSprite.height = 64;
(function () {
  const c = glowSprite.getContext('2d'), g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,226,150,0.9)'); g.addColorStop(0.35, 'rgba(232,180,90,0.45)'); g.addColorStop(1, 'rgba(232,180,90,0)');
  c.fillStyle = g; c.fillRect(0, 0, 64, 64);
})();
// 文字绘制用的离屏画布、整层淡入淡出用的图层
const scratch = document.createElement('canvas'); scratch.width = 2400; scratch.height = 900;
const sctx = scratch.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lctx = layer.getContext('2d');

// 整组元素画到图层上再一次性合成：父级淡出时子元素一起淡出，并可整体压暗
function inLayer(fn, alpha = 1, bright = 1) {
  if (alpha <= 0.002) return;
  const m = ctx.getTransform();
  lctx.save();
  lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.clearRect(0, 0, W, H); lctx.setTransform(m);
  const prev = ctx; ctx = lctx;
  try { fn(); } finally { ctx = prev; }
  lctx.restore();
  if (bright < 0.999) {
    lctx.save(); lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.globalCompositeOperation = 'source-atop';
    lctx.fillStyle = `rgba(0,0,0,${1 - bright})`; lctx.fillRect(0, 0, W, H);
    lctx.restore();
  }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha *= alpha; ctx.drawImage(layer, 0, 0); ctx.restore();
}

// ============================================================ 文字 ============
// 金箔高光：每 6 秒扫过一次（相位使 19 秒正好扫过标题），用时 0.8 秒
function sweepPhase() { const u = mod(T - 1, 6) / 0.8; return u < 1 ? inOut(u) : null; }

// 把金箔文字画进离屏画布（金箔渐变 + source-atop 斜向高光），返回尺寸
function goldGlyphs(text, font, size, bandX) {
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.globalAlpha = 1; sctx.globalCompositeOperation = 'source-over';
  sctx.shadowColor = 'transparent'; sctx.shadowBlur = 0;
  sctx.font = font;
  const w = Math.ceil(sctx.measureText(text).width);
  const pad = Math.ceil(size * 0.3), cw = Math.min(scratch.width, w + pad * 2), ch = Math.min(scratch.height, Math.ceil(size * 1.5));
  sctx.clearRect(0, 0, cw + 2, ch + 2);
  sctx.textAlign = 'left'; sctx.textBaseline = 'middle';
  sctx.fillStyle = goldGrad(ch / 2 - size * 0.5, ch / 2 + size * 0.45, sctx);
  sctx.fillText(text, pad, ch / 2);
  if (bandX != null) {
    sctx.globalCompositeOperation = 'source-atop';
    sctx.save(); sctx.translate(pad + bandX, ch / 2); sctx.rotate(Math.PI / 4);
    const bw = size * 0.6, g = sctx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    sctx.fillStyle = g; sctx.fillRect(-bw / 2, -ch * 2, bw, ch * 4);
    sctx.restore();
    sctx.globalCompositeOperation = 'source-over';
  }
  return { w, cw, ch, pad };
}

// 带深色投影与可选同色发光的文字。color==='gold' 时使用金箔渐变
function glowText(text, x, y, font, color, o = {}) {
  const alpha = o.alpha ?? 1;
  if (alpha <= 0.002 || !text) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = font; ctx.textBaseline = 'middle';
  const align = o.align || 'center';
  const sh = o.shadow ?? true;
  if (color === 'gold') {
    const size = o.size || parseFloat(font.match(/([\d.]+)px/)[1]);
    const w = ctx.measureText(text).width;
    let bandX = null;
    const ph = o.sweep ? sweepPhase() : null;
    if (ph != null) {
      const L = o.sweepL ?? 0, R = o.sweepR ?? w, bw = size * 0.6;
      bandX = lerp(L - bw - size * 0.6, R + bw + size * 0.6, ph);
    }
    const m = goldGlyphs(text, font, size, bandX);
    const x0 = align === 'center' ? x - m.w / 2 : align === 'right' ? x - m.w : x;
    const dx = x0 - m.pad, dy = y - m.ch / 2;
    if (sh) {
      ctx.shadowColor = o.shadowColor || 'rgba(0,0,0,0.85)'; ctx.shadowBlur = o.shadowBlur ?? 12; ctx.shadowOffsetY = o.shadowY ?? 4;
      ctx.drawImage(scratch, 0, 0, m.cw, m.ch, dx, dy, m.cw, m.ch);
    }
    if (o.glow) {
      ctx.shadowColor = o.glowColor || 'rgba(232,180,90,0.6)'; ctx.shadowBlur = o.glow; ctx.shadowOffsetY = 0;
      ctx.drawImage(scratch, 0, 0, m.cw, m.ch, dx, dy, m.cw, m.ch);
    }
    if (!sh && !o.glow) ctx.drawImage(scratch, 0, 0, m.cw, m.ch, dx, dy, m.cw, m.ch);
  } else {
    ctx.textAlign = align; ctx.fillStyle = color;
    if (o.outline) { ctx.lineJoin = 'round'; ctx.strokeStyle = o.outline; ctx.lineWidth = o.outlineW || 3; ctx.strokeText(text, x, y); }
    if (sh) {
      ctx.shadowColor = o.shadowColor || 'rgba(0,0,0,0.85)'; ctx.shadowBlur = o.shadowBlur ?? 12; ctx.shadowOffsetY = o.shadowY ?? 4;
      ctx.fillText(text, x, y);
    }
    if (o.glow) {
      ctx.shadowColor = o.glowColor || color; ctx.shadowBlur = o.glow; ctx.shadowOffsetY = 0;
      ctx.fillText(text, x, y);
    }
    if (!sh && !o.glow) ctx.fillText(text, x, y);
  }
  ctx.restore();
}

// 〔金〕…〔/金〕、〔红〕…〔/红〕 标记解析
function parseMarked(s) {
  const out = []; let cur = null, i = 0;
  while (i < s.length) {
    if (s.startsWith('〔金〕', i)) { cur = 'gold'; i += 3; continue; }
    if (s.startsWith('〔红〕', i)) { cur = 'red'; i += 3; continue; }
    if (s.startsWith('〔/金〕', i) || s.startsWith('〔/红〕', i)) { cur = null; i += 4; continue; }
    out.push({ ch: s[i], c: cur }); i++;
  }
  return out;
}
const _parsed = new Map();
const parsed = s => { let v = _parsed.get(s); if (!v) { v = parseMarked(s); _parsed.set(s, v); } return v; };

// 逐字出现的文字（字幕与画面大字共用）
function drawStaggerLine(t, text, cx, y, size, t0, t1, o = {}) {
  if (t < t0 || t > t1) return;
  const step = o.step ?? 0.035, dur = o.dur ?? 0.45, rise = o.rise ?? 14, fo = o.fadeOut ?? 0.35;
  const weight = o.weight ?? 600, maxW = o.maxW ?? 1700;
  const g = parsed(text), n = g.length;
  let sz = size, font = fs(weight, sz);
  ctx.save();
  ctx.font = font;
  let ws = g.map(c => ctx.measureText(c.ch).width), tot = ws.reduce((a, b) => a + b, 0);
  if (tot > maxW) { sz = size * maxW / tot; font = fs(weight, sz); ctx.font = font; ws = g.map(c => ctx.measureText(c.ch).width); tot = ws.reduce((a, b) => a + b, 0); }
  ctx.restore();
  const tAll = t0 + (n - 1) * step + dur;
  const fp = fo > 0 ? sine(prog(t, t1 - fo, t1)) : 0;
  const left = cx - tot / 2;
  let x = left;
  for (let i = 0; i < n; i++) {
    const c = g[i], w = ws[i];
    const p = o.instant ? 1 : out3(prog(t, t0 + i * step, t0 + i * step + dur));
    if (p <= 0 || c.ch === ' ') { x += w; continue; }
    const a = p * (1 - fp) * (o.alpha ?? 1);
    const yy = y + (1 - p) * rise - 8 * fp;
    let s = 1, dx = 0;
    if (c.c && (o.pop ?? true)) {
      const pp = prog(t, tAll, tAll + 0.35);
      if (pp > 0 && pp < 1) s = 1 + 0.1 * Math.sin(Math.PI * pp);
      if (c.c === 'red') { const q = prog(t, tAll, tAll + 0.25); if (q > 0 && q < 1) dx = 3 * Math.sin(q * Math.PI * 6) * (1 - q); }
    }
    ctx.save();
    ctx.translate(x + w / 2 + dx, yy);
    if (s !== 1) ctx.scale(s, s);
    if (!c.c) {
      glowText(c.ch, 0, 0, font, o.color || C.paper, { alpha: a, shadowColor: 'rgba(0,0,0,0.9)', shadowBlur: o.shadowBlur ?? 14, shadowY: 3 });
    } else if (c.c === 'gold') {
      const off = x - left;
      glowText(c.ch, 0, 0, font, 'gold', { alpha: a, size: sz, glow: o.glow ?? 18, glowColor: 'rgba(232,180,90,0.75)', shadowBlur: o.shadowBlur ?? 14, shadowY: 3, sweep: !!o.sweep, sweepL: -off, sweepR: tot - off });
    } else {
      glowText(c.ch, 0, 0, font, C.redHi, { alpha: a, glow: o.glow ?? 18, glowColor: 'rgba(229,72,77,0.85)', shadowBlur: o.shadowBlur ?? 14, shadowY: 3 });
    }
    ctx.restore();
    x += w;
  }
}

// 向上翻滚的数字（里程表式），裁剪在数字自己的区域内
function rollDigits(v, x, y, font, size, nd, dw, color = 'gold') {
  ctx.save();
  ctx.beginPath(); ctx.rect(x - 6, y - size * 0.56, dw * nd + 12, size * 1.12); ctx.clip();
  const lh = size * 1.3;
  for (let p = 0; p < nd; p++) {
    const place = Math.pow(10, p), w = v / place, fl = Math.floor(w + 1e-9);
    const d = fl % 10;
    let r;
    if (p === 0) r = v - Math.floor(v + 1e-9);
    else r = clamp(mod(v, place) - (place - 1));
    const cur = (p > 0 && fl === 0) ? '' : String(d);
    const nxt = (p > 0 && fl === 0 && r <= 0) ? '' : String((d + 1) % 10);
    const cx = x + (nd - 1 - p) * dw + dw / 2;
    const o = { size, sweep: false, shadowBlur: 8, shadowY: 2 };
    if (r < 0.999) glowText(cur, cx, y - r * lh, font, color, o);
    if (r > 0.001) glowText(nxt, cx, y + (1 - r) * lh, font, color, o);
  }
  ctx.restore();
}

function track(keys, t) {

function camera(t) {

  let x = 8 * Math.sin(0.45 * t) + track(PANX, t);
  let y = 6 * Math.sin(0.33 * t + 1.3) + track(PANY, t);
  for (const [t0, k] of PUNCH) {
    const d = t - t0; if (d < 0) continue;

    if (d < 0.5) { const amp = 9 * Math.exp(-12 * d); x += amp * Math.sin(75 * d); y += amp * Math.cos(61 * d); }
  }

  if (t > 44 && t < 61) {
    const base = 43.0 + 4 * 0.48;

    if (k >= 1) {
      const d = t - (base + k * 2.4);

  ctx.strokeStyle = C.ink; ctx.lineWidth = 11; strokePartial(pts, g);
  ctx.strokeStyle = C.green; ctx.lineWidth = 7; strokePartial(pts, g);
  ctx.strokeStyle = rgba(C.greenHi, 0.7); ctx.lineWidth = 2; strokePartial(pts, g);
  // 两片叶子
  [[0.52, -1, 125.8], [0.7, 1, 126.1]].forEach(([s, side, t0]) => {
    const p = prog(t, t0, t0 + 0.5); if (p <= 0) return;
    const sc = lerp(0.3, 1, outBack(p)), q = bez(...P, s);
    ctx.save(); ctx.translate(q[0], q[1]); ctx.scale(sc, sc); ctx.globalAlpha *= clamp(p * 3);
    const ang = side < 0 ? Math.PI + 0.45 : -0.45;
    leafShape(0, 0, ang, 70, 26); ctx.fillStyle = C.green; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.stroke();
    ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(4, 0); ctx.quadraticCurveTo(35, -3, 62, 0); ctx.strokeStyle = rgba(C.gold, 0.85); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  });
  // 顶端的金色小花
  const top = P[3];
  for (let k = 0; k < 5; k++) {
    const p = prog(t, 126.6 + k * 0.15, 126.95 + k * 0.15); if (p <= 0) continue;
    const sc = lerp(0.2, 1, outBack(p));
    ctx.save(); ctx.translate(top[0], top[1]); ctx.rotate(-Math.PI / 2 + k * TAU / 5); ctx.scale(sc, sc);
    ctx.beginPath(); ctx.ellipse(18, 0, 16, 10, 0, 0, TAU); ctx.fillStyle = C.gold; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(26, 0); ctx.strokeStyle = C.goldLo; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  }
  const cp = prog(t, 126.6, 126.9);
  if (cp > 0) {
    ctx.beginPath(); ctx.arc(top[0], top[1], 9 * outBack(cp), 0, TAU); ctx.fillStyle = C.blue; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
  }
  const hp = prog(t, 127.3, 128.1);
  if (hp > 0 && hp < 1) {
    ctx.save(); ctx.globalAlpha *= (1 - hp);
    ctx.drawImage(glowSprite, top[0] - 80, top[1] - 80, 160, 160);
    ctx.strokeStyle = C.goldHi; ctx.lineWidth = 3 * (1 - hp) + 0.5;
    ctx.beginPath(); ctx.arc(top[0], top[1], 20 + 150 * out3(hp), 0, TAU); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function sceneCh6(t) {
  if (t < 120 || t > 134.05) return;
  if (t < 128.65) inLayer(() => { drawSeedLight(t); drawSoil(t); drawSeed(t); drawSprout(t); }, vis(t, 120.0, 128.6, 0.6, 0.4));
  drawCard(t, 'return');
}

// ============================================================ 结尾 =============
function sceneEnd(t) {
  if (t < 134) return;
  const pa = sine(prog(t, 134.0, 134.5));
  const open = 1 - sine(prog(t, 134.0, 135.4)), bow = sine(prog(t, 134.0, 135.4));
  const bright = lerp(0.6, 0.42, sine(prog(t, 135.6, 136.4)));
  inLayer(() => drawPeacock(960, 568, 0.68, open, bow, t, { show: 0.5 * open }), pa, bright);
  const ta = sine(prog(t, 134.4, 135.6));
  const s = lerp(1.06, 1, out3(prog(t, 134.4, 135.6)));
  ctx.save(); ctx.translate(960, 420); ctx.scale(s, s);
  glowText('傲慢', 0, 0, fs(700, 220), 'gold', { alpha: ta, size: 220, glow: 46, glowColor: 'rgba(232,170,80,0.5)', shadowBlur: 22, shadowY: 8, sweep: true });
  ctx.restore();
  glowText('七  宗  罪', 960, 250, fs(600, 36), C.gold, { alpha: ta, shadowBlur: 10 });
  drawStaggerLine(t, '真正的高处，是〔金〕看得见别人〔/金〕的地方。', 960, 660, 48, 135.6, 140.1, { weight: 600, step: 0.06, dur: 0.6, rise: 16, glow: 26, sweep: true, fadeOut: 0, shadowBlur: 18 });
  glowText('七宗罪 · 下一集：懒惰', 960, 780, fs(600, 34), C.gold, { alpha: sine(prog(t, 136.8, 137.4)), glow: 20, glowColor: 'rgba(232,180,90,0.7)', shadowBlur: 10 });
  const ra = sine(prog(t, 137.2, 137.8));
  if (ra > 0) {
    const ref = '参考：格里高利一世《约伯记释义》｜但丁《神曲·炼狱篇》｜美国大学理事会1976至1977学年学生调查｜斯文森，1981｜普罗宁、林与罗斯，2002｜路易斯《返璞归真》';
    ctx.save(); ctx.font = fs(400, 22); const w = ctx.measureText(ref).width; ctx.restore();
    const sz = w > 1740 ? 22 * 1740 / w : 22;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); // 参考文献不随镜头推近，固定在安全区内
    ctx.save(); ctx.globalAlpha *= ra;
    const g = ctx.createLinearGradient(0, 960, 0, 1040);
    g.addColorStop(0, 'rgba(20,12,6,0)'); g.addColorStop(0.5, 'rgba(20,12,6,0.62)'); g.addColorStop(1, 'rgba(20,12,6,0)');
    ctx.fillStyle = g; ctx.fillRect(40, 960, W - 80, 80); ctx.restore();
    glowText(ref, 960, 1000, fs(400, sz), '#9A8C74', { alpha: ra, shadowBlur: 6, shadowY: 2 });
    ctx.restore();
  }
}

// ============================================================ 主函数 ===========
function render(t) {
  T = t; ctx = mainCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
  // 1 背景
  drawBackground(t);
  // 2–3 镜头空间
  const cam = camera(t);
  drawDust(t, cam);
  ctx.save(); applyCam(cam);
  sceneHook(t); sceneTitle(t); sceneCh1(t); sceneCh2(t); sceneCh3(t); sceneCh4(t); sceneCh5(t); sceneCh6(t); sceneEnd(t);
  drawFeathers(t);
  drawBig(t);
  ctx.restore();
  // 5 不受镜头影响的层
  drawFrame(t); drawChapterBar(t); drawInitials(t); drawSources(t); drawSubs(t);
  // 6 后期
  drawPost(t);
}
window.render = render;
window.DURATION = 140;
// 预热字体
(function () {
  for (const f of [fs(400, 20), fs(500, 20), fs(600, 20), fs(700, 20), fsans(500, 20), fm(700, 20)]) { ctx.font = f; ctx.fillText('傲慢0', -100, -100); }
  render(0);
  window.READY = true;
})();
</script>
