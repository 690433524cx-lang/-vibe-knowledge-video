<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>罐底</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Noto+Sans+SC:wght@500&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;cursor:none}
*{cursor:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#050505}
#stage>*,#camera>*{position:absolute;left:0;top:0;width:1920px;height:1080px}
#bg{background:#050505}
#sky{position:absolute;inset:0;opacity:0;background:linear-gradient(to bottom,#0B1630 0%,#3A2E4F 40%,#E8A26A 100%)}
#horizon{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse 70% 22% at 50% 100%,rgba(255,214,160,.85) 0%,rgba(232,162,106,.45) 40%,rgba(232,162,106,0) 100%)}
#camera{transform-origin:960px 540px;will-change:transform}
#far,#near{transform-origin:960px 540px;will-change:transform}
#dom,#subtitle,#fx{pointer-events:none}
.row{position:absolute;width:3000px;text-align:center;white-space:nowrap;line-height:1.2;transform-origin:50% 50%}
.serif{font-family:'Noto Serif SC',serif;font-weight:700}
.sans{font-family:'Noto Sans SC',sans-serif;font-weight:500}
.mono{font-family:'JetBrains Mono',monospace;font-weight:500}
.ch{display:inline-block}
.kw{display:inline-block;transform-origin:50% 60%}
.gold{color:#E8C27A;text-shadow:0 0 18px rgba(232,194,122,.55)}
.red{color:#E5484D;text-shadow:0 0 14px rgba(229,72,77,.45)}
.grey{color:#8A8A8A}
#subtitle .sub{position:absolute;left:0;width:1920px;bottom:78px;text-align:center;font-size:56px;color:#F2F2F2;letter-spacing:.06em;text-shadow:0 2px 12px rgba(0,0,0,.85);line-height:1.1;white-space:nowrap}
#subtitle .sub .in{display:inline-block}
.fxl{position:absolute;inset:0}
#vig{background:radial-gradient(ellipse 75% 75% at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.45) 100%)}
#redvig{opacity:0;background:radial-gradient(ellipse 72% 72% at 50% 50%,rgba(60,4,8,0) 35%,rgba(90,8,14,.55) 80%,rgba(70,4,8,.8) 100%)}
#flash{opacity:0;background:#fff}
#sweep{left:0;top:0;width:240px;height:3200px;opacity:0;background:linear-gradient(to right,rgba(232,194,122,0) 0%,rgba(232,194,122,.22) 50%,rgba(232,194,122,0) 100%);transform-origin:50% 50%;mix-blend-mode:screen}
.tear{position:absolute;left:-40px;width:2000px;opacity:0;mix-blend-mode:screen}
#grain{opacity:.04;image-rendering:auto}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><div id="sky"></div><div id="horizon"></div></div>
  <canvas id="far"></canvas>
  <div id="camera">
    <canvas id="main"></canvas>
    <div id="dom">
      <div id="hook1" class="row serif" style="left:-540px;top:392px;font-size:96px;color:#F2F2F2;opacity:.7;filter:blur(4px)">让你最痛苦的，</div>
      <div id="hook2" class="row serif" style="left:-540px;top:523px;font-size:112px;color:#F2F2F2;opacity:.7;filter:blur(4px)">可能不是<span class="kw grey">绝望</span>，是<span class="kw gold" id="hopeKw" style="text-shadow:0 0 28px rgba(232,194,122,.7)">希望</span>。</div>
    </div>
  </div>
  <canvas id="near"></canvas>
  <div id="subtitle"></div>
  <div id="fx">
    <div id="vig" class="fxl"></div>
    <div id="redvig" class="fxl"></div>
    <div id="sweep"></div>
    <div id="tear1" class="tear"></div><div id="tear2" class="tear"></div><div id="tear3" class="tear"></div>
    <div id="flash" class="fxl"></div>
  </div>
  <canvas id="grain"></canvas>
</div>
<script>
'use strict';
/* =====================================================================
   《罐底》 —— 单文件动画短片
   时间单位：秒。坐标：1920×1080 舞台，原点左上角。
   卡点时间表在 buildFilm() 里实时计算，并在加载时 console.log 打印。
   ===================================================================== */

// ---------- 常量与配色 ----------
const W = 1920, H = 1080, CX = 960, CY = 540;
const GOLD = '#E8C27A', CLAY = '#B8643A', CLAY_L = '#D07A48', CLAY_D = '#7A3A1E';
const FOGC = '#141012', RED = '#E5484D', WHITE = '#F2F2F2', G1 = '#D0D0D0', G2 = '#8A8A8A', G3 = '#3A3A3A';
const $ = id => document.getElementById(id);
const stage = $('stage'), camEl = $('camera'), domL = $('dom'), subL = $('subtitle');
const cMain = $('main'), cFar = $('far'), cNear = $('near'), cGrain = $('grain');
const mctx = cMain.getContext('2d'), fctx = cFar.getContext('2d'), nctx = cNear.getContext('2d'), gctx = cGrain.getContext('2d');

// ---------- 小工具 ----------
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut3 = t => 1 - Math.pow(1 - clamp(t), 3);
const hexRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixHex = (a, b, t) => { const x = hexRgb(a), y = hexRgb(b); return `rgb(${Math.round(lerp(x[0], y[0], t))},${Math.round(lerp(x[1], y[1], t))},${Math.round(lerp(x[2], y[2], t))})`; };
const rgba = (h, a) => { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
function hash(i, k) { let x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); }

// ---------- 舞台缩放与 Canvas 分辨率 ----------
let stageScale = 1, K = 1;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stageScale = s;
  stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
  K = clamp(s * (window.devicePixelRatio || 1), 0.5, 2);
  for (const c of [cMain, cFar, cNear]) { c.width = Math.round(W * K); c.height = Math.round(H * K); }
  cGrain.width = 480; cGrain.height = 270;
}
addEventListener('resize', fit);
fit();

// ---------- 全局状态（GSAP 时间线直接补间这些数值，渲染循环每帧读取） ----------
const S = {
  t: 0, frozen: false,
  cam: { s: 1, x: 0, y: 0, fx: CX, fy: CY, bs: 1, imp: 0, shake: 0 },
  redV: 0, chroma: 0, dustWarm: 0,
  jar: { a: 0, x: CX, y: 520, s: 1, lid: 0, cs: 0, glow: 0, reveal: 1, fill: 1, coreRed: 0, pulse: 0, breath: 0, innerFog: 0 },
  F: { swirl: 0, sx: CX, sy: 520, sr: 330, blast: 0, bx: CX, by: 560, wind: -8, noise: 22, push: 0 },
  amb: { rate: 0, x: CX, y: 600, rx: 420, ry: 380 },
  s1: { dotA: 0, dx: CX, dy: 620, dr: 1, hopeFlick: 1 },
  s2: { handA: 0, fireA: 0, fireP: 0, peopleA: 0, lit: 0, bolt: 0, boltA: 0, pandA: 0, reveal: 0, fill: 0, disc: 0 },
  s3: { boxA: 0, boxDraw: 0, xDraw: 0, vDraw: 0, boxFlash: 0, jarFlash: 0, marksA: 1 },
  s4: { linkA: 0, linkDraw: 0, lineA: 0, x0: 360, x1: 360, red: 0, dotY: 520, gold: 0 },
  s5: { a: 0, lineW: 0, lineA: 0, lineY: 600, shapesA: 0, monkey: 0, beam: 0, beamA: 0, trialClk: 0, exp: 1, chart: 0, h: [0, 0, 0, 0, 0], goldBar: 0, dim: 0, best: 0, titleA: 0, chartS: 1, chartY: 0, chartA: 1 },
  s6: { a: 0, pan: 0, clk: 0, ts: 0, lit1: 0, taut1: 0, year: 0, taut2: 0, scroll: 0, fing: 0, msg: 0, taut3: 0, glow: 0, grid: 0, sceneA: 1, jarsA: 0, merge: 0 },
  s7: { orbP: 0, orbA: 0 }
};

// ---------- 2D 噪声（Perlin） ----------
const PERM = new Uint8Array(512);
(() => { const p = []; for (let i = 0; i < 256; i++) p[i] = i; for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; })();
function grad(h, x, y) { switch (h & 7) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y; case 4: return x; case 5: return -x; case 6: return y; default: return -y; } }
function noise(x, y) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255; x -= Math.floor(x); y -= Math.floor(y);
  const u = x * x * x * (x * (x * 6 - 15) + 10), v = y * y * y * (y * (y * 6 - 15) + 10);
  const a = PERM[X] + Y, b = PERM[X + 1] + Y;
  return lerp(lerp(grad(PERM[a], x, y), grad(PERM[b], x - 1, y), u), lerp(grad(PERM[a + 1], x, y - 1), grad(PERM[b + 1], x - 1, y - 1), u), v) * 0.5 + 0.5;
}

// ---------- 预渲染精灵（柔和雾团、金色光晕、亮烟） ----------
function sprite(size, stops) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), r = size / 2, gr = g.createRadialGradient(r, r, 0, r, r, r);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const SPR = {
  fog: sprite(128, [[0, 'rgba(40,32,36,.6)'], [.4, 'rgba(30,24,27,.42)'], [.75, 'rgba(60,22,27,.14)'], [1, 'rgba(20,16,18,0)']]),
  fogLit: sprite(128, [[0, 'rgba(72,60,65,.5)'], [.45, 'rgba(48,38,42,.32)'], [.8, 'rgba(96,32,38,.1)'], [1, 'rgba(20,16,18,0)']]),
  smoke: sprite(64, [[0, 'rgba(220,214,210,.75)'], [.5, 'rgba(160,150,150,.35)'], [1, 'rgba(120,110,110,0)']]),
  gold: sprite(64, [[0, 'rgba(255,240,205,1)'], [.18, 'rgba(232,194,122,.9)'], [.5, 'rgba(232,194,122,.25)'], [1, 'rgba(232,194,122,0)']]),
  glow: sprite(128, [[0, 'rgba(232,194,122,.9)'], [.35, 'rgba(232,194,122,.35)'], [1, 'rgba(232,194,122,0)']]),
  white: sprite(64, [[0, 'rgba(255,255,255,1)'], [.3, 'rgba(255,255,255,.5)'], [1, 'rgba(255,255,255,0)']]),
  red: sprite(64, [[0, 'rgba(229,72,77,.9)'], [.4, 'rgba(229,72,77,.3)'], [1, 'rgba(229,72,77,0)']]),
  dust: sprite(16, [[0, 'rgba(255,240,220,1)'], [.4, 'rgba(255,240,220,.5)'], [1, 'rgba(255,240,220,0)']]),
  dustGold: sprite(16, [[0, 'rgba(255,226,170,1)'], [.4, 'rgba(232,194,122,.5)'], [1, 'rgba(232,194,122,0)']]),
  bokehG: sprite(128, [[0, 'rgba(232,194,122,1)'], [.55, 'rgba(232,194,122,.7)'], [1, 'rgba(232,194,122,0)']]),
  bokehW: sprite(128, [[0, 'rgba(255,236,210,1)'], [.55, 'rgba(255,236,210,.7)'], [1, 'rgba(255,236,210,0)']])
};

// ---------- 粒子系统（对象池，总上限 3500） ----------
// 类型：0 雾团  1 金色火星（拖尾）  2 灰烬碎片  3 金色归位粒子  4 白色文字烟
const MAXP = 3500, pool = [], freeIdx = [];
for (let i = 0; i < MAXP; i++) { pool.push({ on: false, i }); freeIdx.push(MAXP - 1 - i); }
function spawn(o) {
  if (!freeIdx.length) return null;
  const p = pool[freeIdx.pop()];
  p.on = true; p.type = 0; p.x = 0; p.y = 0; p.vx = 0; p.vy = 0; p.life = 0; p.max = 3; p.size = 10; p.a = 1;
  p.delay = 0; p.seed = Math.random() * 100; p.layer = 1; p.drag = 1; p.g = 0; p.heat = 0; p.tx = 0; p.ty = 0; p.lit = Math.random() < .3; p.col = GOLD; p.rot = 0;
  Object.assign(p, o); p.px = p.x; p.py = p.y; return p;
}
function kill(p) { p.on = false; freeIdx.push(p.i); }
function clearParticles() { for (const p of pool) if (p.on) kill(p); }
function activeCount() { return MAXP - freeIdx.length; }

function updateParticles(dt) {
  const T = S.t, F = S.F;
  // 环境雾发射器（第四幕罐外稀薄黑雾）
  if (S.amb.rate > 0) {
    S.amb.acc = (S.amb.acc || 0) + S.amb.rate * dt;
    while (S.amb.acc >= 1) {
      S.amb.acc -= 1; const an = Math.random() * Math.PI * 2, rr = rand(.72, 1.15);
      spawn({ type: 0, x: S.amb.x + Math.cos(an) * S.amb.rx * rr, y: S.amb.y + Math.sin(an) * S.amb.ry * rr, size: rand(40, 90), a: rand(.3, .5), max: rand(5, 7.5), drag: .8, layer: Math.random() < .5 ? 0 : 1 });
    }
  }
  // 一次性喷发发射器
  for (let k = emitters.length - 1; k >= 0; k--) {
    const e = emitters[k]; e.t += dt; if (e.t > e.dur) { emitters.splice(k, 1); continue; }
    e.acc += e.rate * dt; while (e.acc >= 1) { e.acc -= 1; e.make(); }
  }
  for (let i = 0; i < MAXP; i++) {
    const p = pool[i]; if (!p.on) continue;
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.life += dt; if (p.life >= p.max) { kill(p); continue; }
    p.px = p.x; p.py = p.y;
    if (p.type === 0 || p.type === 4) {
      const n = noise(p.x * .0023 + T * .05, p.y * .0023 + p.seed);
      const ang = n * Math.PI * 2.6 + p.seed;
      let tx = Math.cos(ang) * F.noise, ty = Math.sin(ang) * F.noise + F.wind;
      if (p.type === 4) { tx *= 2.4; ty = ty * 2.4 - 60; }
      if (F.push > 0 && p.type === 0) {
        const dx = p.x - F.bx, dy = p.y - F.by, d = Math.hypot(dx, dy) + 1;
        tx += dx / d * F.push; ty += dy / d * F.push * .8;
      }
      if (F.swirl > 0) {
        const dx = p.x - F.sx, dy = p.y - F.sy, d = Math.hypot(dx, dy) + 1;
        tx += (-dy / d) * 48 * F.swirl - (dx / d) * (d - F.sr) * .22 * F.swirl;
        ty += (dx / d) * 48 * F.swirl - (dy / d) * (d - F.sr) * .22 * F.swirl;
      }
      if (F.blast > 0) {
        const dx = p.x - F.bx, dy = p.y - F.by, d = Math.hypot(dx, dy) + 1;
        tx += dx / d * 1500 * F.blast; ty += dy / d * 1500 * F.blast;
      }
      const k = Math.min(1, dt * p.drag); p.vx += (tx - p.vx) * k; p.vy += (ty - p.vy) * k;
      if (p.heat > 0) p.heat = Math.max(0, p.heat - dt * 1.4);
    } else if (p.type === 1) {
      p.vy += p.g * dt; const k = Math.max(0, 1 - dt * p.drag); p.vx *= k; p.vy *= k;
    } else if (p.type === 2) {
      p.vy += p.g * dt; const k = Math.max(0, 1 - dt * p.drag); p.vx *= k; p.vy *= k; p.rot += dt * p.spin;
    } else if (p.type === 3) {
      const k = Math.min(1, dt * p.drag);
      p.vx += ((p.tx - p.x) * 3.2 - p.vx) * k; p.vy += ((p.ty - p.y) * 3.2 - p.vy) * k;
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
// 雾与烟本身就是模糊的，画在半分辨率缓冲上再合成，大幅降低填充开销
const fogC = document.createElement('canvas'); fogC.width = 960; fogC.height = 540;
const fogX = fogC.getContext('2d');
function drawParticles(ctx, layer) {
  // 雾与烟（普通混合）
  fogX.setTransform(1, 0, 0, 1, 0, 0); fogX.clearRect(0, 0, 960, 540); fogX.setTransform(.5, 0, 0, .5, 0, 0);
  let anyFog = false;
  for (let i = 0; i < MAXP; i++) {
    const p = pool[i]; if (!p.on || p.delay > 0 || p.layer !== layer || (p.type !== 0 && p.type !== 4 && p.type !== 2)) continue;
    const fi = Math.min(1, p.life / (p.type === 4 ? .15 : .5)), fo = Math.min(1, (p.max - p.life) / Math.min(1.2, p.max * .4));
    const al = p.a * fi * fo; if (al <= .003) continue;
    if (p.type === 2) {
      ctx.globalAlpha = al; ctx.fillStyle = p.col;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 5, p.size, p.size / 2.5); ctx.restore();
      continue;
    }
    const s = p.type === 4 ? p.size * (1 + p.life * 1.6) : p.size;
    if (p.heat > 0) { fogX.globalAlpha = al * p.heat; fogX.drawImage(SPR.smoke, p.x - s, p.y - s, s * 2, s * 2); }
    fogX.globalAlpha = al * (1 - p.heat * .7);
    fogX.drawImage(p.lit ? SPR.fogLit : SPR.fog, p.x - s, p.y - s, s * 2, s * 2);
    anyFog = true;
  }
  if (anyFog) { ctx.globalAlpha = 1; ctx.drawImage(fogC, 0, 0, W, H); }
  // 金色发光粒子（叠加混合 + 运动拖尾）
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < MAXP; i++) {
    const p = pool[i]; if (!p.on || p.delay > 0 || p.layer !== layer || (p.type !== 1 && p.type !== 3)) continue;
    const fi = Math.min(1, p.life / .12), fo = Math.min(1, (p.max - p.life) / .5);
    const al = p.a * fi * fo; if (al <= .003) continue;
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > 60) {
      ctx.globalAlpha = al * .7; ctx.strokeStyle = p.col; ctx.lineWidth = p.size * .8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x - p.vx * .045, p.y - p.vy * .045); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    ctx.globalAlpha = al; const s = p.size * 3;
    ctx.drawImage(SPR.gold, p.x - s, p.y - s, s * 2, s * 2);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
const emitters = [];
function emitter(dur, rate, make) { emitters.push({ t: 0, dur, rate, acc: 0, make }); }

// ---------- 远景微尘（90 个） ----------
const dust = [];
for (let i = 0; i < 90; i++) dust.push({ x: rand(-100, W + 100), y: rand(-100, H + 100), r: rand(.5, 1.25), a: rand(.1, .3), vx: rand(-5, 5), vy: rand(-4, 4), ph: rand(0, 6.28) });
function updateDust(dt) {
  for (const d of dust) {
    d.x += (d.vx * (1 - S.dustWarm * .6)) * dt; d.y += (d.vy - S.dustWarm * 16) * dt;
    if (d.x < -120) d.x += W + 240; if (d.x > W + 120) d.x -= W + 240;
    if (d.y < -120) d.y += H + 240; if (d.y > H + 120) d.y -= H + 240;
  }
}
function drawFar() {
  const ctx = fctx; ctx.setTransform(K, 0, 0, K, 0, 0); ctx.clearRect(0, 0, W, H);
  for (const d of dust) {
    const tw = .8 + .2 * Math.sin(S.t * 1.3 + d.ph), s = (d.r + 2) * 2;
    ctx.globalAlpha = d.a * tw * (1 + S.dustWarm * .6);
    ctx.drawImage(S.dustWarm > .5 ? SPR.dustGold : SPR.dust, d.x - s / 2, d.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}

// ---------- 近景虚化光斑（2–4 个） ----------
const bokeh = [];
function newBokeh(side) {
  const r = rand(20, 60), fromLeft = Math.random() < .5;
  return { r, x: side ? (fromLeft ? -r * 2 : W + r * 2) : rand(0, W), y: rand(80, H - 80), vx: (fromLeft ? 1 : -1) * rand(8, 22), vy: rand(-5, 5), a: rand(.05, .12), gold: Math.random() < .6 };
}
for (let i = 0; i < 3; i++) bokeh.push(newBokeh(false));
function updateBokeh(dt) {
  for (let i = 0; i < bokeh.length; i++) {
    const b = bokeh[i]; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < -200 || b.x > W + 200 || b.y < -200 || b.y > H + 200) bokeh[i] = newBokeh(true);
  }
}
function drawNear() {
  const ctx = nctx; ctx.setTransform(K, 0, 0, K, 0, 0); ctx.clearRect(0, 0, W, H);
  for (const b of bokeh) { ctx.globalAlpha = b.a; const s = b.r * 2.6; ctx.drawImage(b.gold ? SPR.bokehG : SPR.bokehW, b.x - s / 2, b.y - s / 2, s, s); }
  ctx.globalAlpha = 1;
}

// ---------- 胶片噪点 ----------
const grainFrames = [];
(() => {
  for (let f = 0; f < 6; f++) {

  }
  ctx.restore();
  drawPhoneFrame(ctx, cx, cy);
  if (s.fing > 0 && s.fing < 1) { // 上滑的手指
    const fy = lerp(720, 360, easeOut3(s.fing)), al = Math.sin(Math.PI * s.fing);
    ctx.save(); ctx.globalAlpha = al; ctx.strokeStyle = WHITE; ctx.lineWidth = 2; ctx.shadowColor = WHITE; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(1050, fy, 24, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1036, fy + 22); ctx.lineTo(1030, fy + 90); ctx.moveTo(1064, fy + 22); ctx.lineTo(1070, fy + 90); ctx.stroke();
    ctx.globalAlpha = al * .35; ctx.beginPath(); ctx.moveTo(1050, fy + 30); ctx.lineTo(1050, fy + 150); ctx.stroke();
    ctx.restore();
  }
  goldThread(ctx, 1210, 92, 1090, 150, s.taut3, 1, s.clk);
}
function drawS6(ctx) {
  const s = S.s6; if (s.a <= 0) return;
  const fns = [sub1, sub2, sub3];
  if (s.sceneA > 0) for (let j = 0; j < 3; j++) {
    const ox = lerp((j - s.pan) * 1920, (j - 1) * 700, s.grid), sc = lerp(1, .6, s.grid);
    if (Math.abs(ox) > 1920 * 1.05 && s.grid < .01) continue;
    ctx.save(); ctx.globalAlpha = s.a * s.sceneA; ctx.translate(960 + ox, 540); ctx.scale(sc, sc); ctx.translate(-960, -540);
    fns[j](ctx, s); ctx.restore();
  }
  if (s.jarsA > 0) for (let j = 0; j < 3; j++) { // 三个场景变成三个小陶罐，汇聚成一个
    const x = lerp(960 + (j - 1) * 700, 960, s.merge), y = lerp(540, 560, s.merge), sc = lerp(.5, .9, s.merge);
    drawJar(ctx, x, y, sc, { style: 'full', crossSection: .7, innerGlow: .9, pulse: 1, alpha: s.jarsA });
  }
}
function scene6() {
  const tl = gsap.timeline(), DUR = 24;
  const subs = [
    { t: .5, m: '等一条不会回的消息，每隔几分钟就看一次。' },
    { t: 8.0, m: '一份早该辞的工作，你总想着“<g>明年就好了</g>”。' },
    { t: 15.5, m: '你现在刷视频停不下来，也是因为——' },
    { t: 19.0, m: '下一个，“<g>说不定</g>”更好看。' }], end = { t: 22.5 };
  const { M } = makePlan(subCons(subs, end));
  Object.assign(S.s6, { pan: 0, ts: 0, lit1: 0, taut1: 0, year: 0, taut2: 0, scroll: 0, fing: 0, msg: 0, taut3: 0, grid: 0, sceneA: 1, jarsA: 0, merge: 0 });
  tl.fromTo(S.s6, { clk: 0 }, { clk: M(DUR), duration: M(DUR), ease: 'none', immediateRender: false }, 0);
  // 镜头：每个小场景开始时轻推 1.00 → 1.05
  tl.to(S.cam, { s: 1.05, duration: 7.2, ease: 'sine.inOut' }, 0);
  tl.to(S.cam, { s: 1, duration: .6, ease: 'power3.inOut' }, 7.2);
  tl.to(S.cam, { s: 1.05, duration: 6.9, ease: 'sine.inOut' }, 7.8);
  tl.to(S.cam, { s: 1, duration: .6, ease: 'power3.inOut' }, M(14.7));
  tl.to(S.cam, { s: 1.05, duration: M(22.5) - M(15.3), ease: 'sine.inOut' }, M(15.3));

  // 场景一：等一条不会回的消息
  tl.to(S.s6, { glow: 0, duration: 1.4, ease: 'power2.out' }, .3);
  [.3, 2.6, 4.9].forEach((t, k) => {
    if (k) tl.to(S.s6, { ts: k, duration: .5, ease: 'power3.inOut' }, t);
    tl.fromTo(S.s6, { lit1: 1 }, { lit1: 0, duration: 1.1, ease: 'power2.out', immediateRender: false }, t + .25);
    tl.fromTo(S.s6, { taut1: 1 }, { taut1: 0, duration: .9, ease: 'power2.out', immediateRender: false }, t + .25);
  });
  tl.to(S.s6, { pan: 1, duration: .6, ease: 'power3.inOut' }, 7.2);
  // 场景二：一份早该辞的工作
  [10.4, 12.7].forEach((t, k) => {
    tl.to(S.s6, { year: k + 1, duration: .5, ease: 'power2.inOut' }, t);
    tl.fromTo(S.s6, { taut2: 1 }, { taut2: 0, duration: .9, ease: 'power2.out', immediateRender: false }, t);
  });
  tl.to(S.s6, { pan: 2, duration: .6, ease: 'power3.inOut' }, M(14.7));
  // 场景三：刷不停的视频
  const swipes = [15.6, 16.8, 17.8, 18.6, 19.25, 19.8, 20.3, 20.7, 20.95, 21.3, 21.6, 21.85, 22.1];
  swipes.forEach((t, k) => {
    const d = Math.max(.2, .5 - k * .03), at = M(t);
    tl.to(S.s6, { scroll: k + 1, duration: d, ease: 'power3.out' }, at);
    tl.fromTo(S.s6, { fing: 0 }, { fing: 1, duration: d * 1.1, ease: 'none', immediateRender: false }, at - .05);
    tl.fromTo(S.s6, { msg: 1 }, { msg: 0, duration: .9, ease: 'power2.in', immediateRender: false }, at + .1);
    tl.fromTo(S.s6, { taut3: 1 }, { taut3: 0, duration: .6, ease: 'power2.out', immediateRender: false }, at);
  });
  // 21.0 画面完全静止 0.5 秒
  tl.call(() => freeze(.5), null, M(21.0)); cue('第六幕 · 画面完全静止0.5秒', M(21.0));
  addSubs(tl, M, subs, end);

  // 收束：三个场景并排 → 三个小陶罐 → 汇聚成一个大陶罐
  const tt = M(22.5);
  tl.to(S.s6, { grid: 1, duration: .6, ease: 'power3.inOut' }, tt);
  tl.to(S.cam, { s: .7, duration: .6, ease: 'power3.inOut' }, tt);
  tl.to(S.s6, { sceneA: 0, jarsA: 1, duration: .4, ease: 'power2.inOut' }, tt + .6);
  tl.to(S.s6, { merge: 1, duration: .6, ease: 'power3.inOut' }, tt + 1.0);
  tl.to(S.cam, { s: 1, duration: .6, ease: 'power3.inOut' }, tt + 1.0);
  tl.set(S.jar, { x: 960, y: 560, s: .9, lid: 0, cs: 0, glow: .6, coreRed: 0, pulse: 0, breath: 1, reveal: 1, fill: 1, showCore: 0, a: 0 }, tt);
  tl.to(S.jar, { a: 1, duration: .3 }, tt + 1.35);
  tl.to(S.s6, { jarsA: 0, duration: .25 }, tt + 1.5);
  return { tl, dur: M(DUR) };
}

// =====================================================================
//  第七幕｜结尾（125–142）
// =====================================================================
function drawS7(ctx) {
  const s = S.s7; if (s.orbA <= 0) return;
  const pos = p => { const u = 1 - p, x0 = 960, y0 = 330, cx = 1190, cy = 230, x1 = 1330, y1 = -40; return { x: u * u * x0 + 2 * u * p * cx + p * p * x1, y: u * u * y0 + 2 * u * p * cy + p * p * y1 }; };
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let k = 1; k < 26; k++) { const q = pos(Math.max(0, s.orbP - k * .008)); ctx.globalAlpha = s.orbA * (1 - k / 26) * .55; const r = 12 - k * .35; ctx.drawImage(SPR.gold, q.x - r, q.y - r, r * 2, r * 2); }
  ctx.restore();
  const p = pos(s.orbP); glowDot(ctx, p.x, p.y, s.orbA, 6 + s.orbP * 6, 50 + s.orbP * 110);
}
function scene7() {
  const tl = gsap.timeline(), DUR = 19.4;
  const Am = '希望没有错。它能<g>撑着你</g>，走过最黑的路。', Bm = '可如果它让你一直，不肯离开——', Cm = '也许，是时候让它<g>飞走</g>了。', Fm = '致每一个，<g>还在等</g>的人。';
  const { M } = makePlan([
    { from: .2, to: 5.8, need: mainHold(plain(Am).length, .06, .5, 4), at: 5.8 },
    { from: 6.0, to: 10.8, need: mainHold(plain(Bm).length, .06, .5, 3.5), at: 10.8 },
    { from: 11.2, to: 15.0, need: mainHold(plain(Cm).length, .06, .5, 3.5), at: 15.0 }]);
  breathe(tl, M(DUR), false);
  tl.to(S.cam, { s: 1.08, duration: M(DUR), ease: 'sine.inOut' }, 0);
  tl.to(S.cam, { fy: 500, duration: 6, ease: 'sine.inOut' }, M(DUR) - 6);
  Object.assign(S.s7, { orbP: 0, orbA: 0 });

  // 0–6
  const A = mkText(Am, 960, 230, 60, 'serif', { color: WHITE });
  textIn(tl, A, .2); textOut(tl, A, M(5.8));
  // 6–11
  const B = mkText(Bm, 960, 230, 60, 'serif', { color: WHITE });
  textIn(tl, B, M(6.0)); textOut(tl, B, M(10.8));
  tl.to(S.jar, { glow: .35, showCore: .55, duration: 1.5, ease: 'sine.inOut' }, M(6.5));
  tl.to(S.jar, { coreRed: .9, duration: .5 }, M(7.6)).to(S.jar, { coreRed: .25, duration: 1.2 }, M(8.1));
  // 11–15 日出前的天空，罐盖轻轻打开，光点飞走
  const t11 = M(11);
  tl.to('#sky', { opacity: 1, duration: 3, ease: 'sine.inOut' }, t11);
  tl.to('#horizon', { opacity: 1, duration: 4, ease: 'sine.inOut' }, t11 + .5);
  tl.to(S, { dustWarm: 1, duration: 3, ease: 'sine.inOut' }, t11);
  tl.to(S.jar, { lid: .6, duration: 2, ease: 'sine.inOut' }, t11);
  tl.to(S.jar, { glow: .8, showCore: 0, coreRed: 0, duration: 1.5, ease: 'sine.inOut' }, t11);
  const to = M(12.4);
  tl.set(S.s7, { orbA: 1 }, to);
  tl.to(S.s7, { orbP: 1, duration: 3.4, ease: 'sine.inOut' }, to);
  tl.to(S.s7, { orbA: 0, duration: 1.0, ease: 'power2.in' }, to + 2.6);
  tl.to(S.jar, { glow: .25, duration: 2 }, to + .5);
  cue('第七幕 · 金色光点飞出罐口', to);
  const C = mkText(Cm, 960, 230, 64, 'serif', { color: WHITE });
  textIn(tl, C, M(11.2)); textOut(tl, C, M(15.0));
  tl.to(S.jar, { y: 872, s: .46, duration: 1.8, ease: 'sine.inOut' }, M(14.2));
  // 15–17 结尾句，停在最后一帧
  const F = mkText(Fm, 960, 500, 64, 'serif', { color: WHITE });
  const Tt = mkText('《罐底》', 960, 612, 32, 'sans', { color: 'rgba(242,242,242,.7)', letterSpacing: '.5em', paddingLeft: '.5em' });
  textIn(tl, F, M(15.4), { stagger: .08, dur: .6 });
  fadeIn(tl, Tt.el, M(16.6), .9, 6);
  tl.set({}, {}, M(DUR));
  return { tl, dur: M(DUR) };
}

// =====================================================================
//  主渲染循环
// =====================================================================
function drawMain() {
  const c = mctx; c.setTransform(K, 0, 0, K, 0, 0); c.clearRect(0, 0, W, H);
  c.lineCap = 'round'; c.lineJoin = 'round';
  drawParticles(c, 0);
  drawS2(c); drawS4(c); drawS5(c); drawS6(c);
  const j = S.jar;
  drawJar(c, j.x, j.y, j.s, { lidOpen: j.lid, crossSection: j.cs, innerGlow: j.glow, style: 'full', alpha: j.a, reveal: j.reveal, fill: j.fill, coreRed: j.coreRed, pulse: j.pulse, breath: j.breath, showCore: j.showCore });
  drawS3(c); drawS1(c); drawS7(c);
  drawParticles(c, 1);
}
function hopeFlicker() { // “希望”的金色发光像烛火一样摇曳（60%–100%）
  if (!hopeKw || S.s1.hopeFlick <= 0) return;
  const k = .6 + .4 * clamp((noise(S.t * 1.9, 3.3) - .2) / .6);
  hopeKw.style.textShadow = `0 0 ${(16 + 14 * k).toFixed(1)}px rgba(232,194,122,${(.72 * k).toFixed(3)})`;
}
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  if (!S.frozen) { S.t += dt; updateParticles(dt); updateDust(dt); updateBokeh(dt); hopeFlicker(); }
  applyCamera(); drawMain(); drawFar(); drawNear(); drawGrain(); applyFx();
  requestAnimationFrame(frame);
}

// =====================================================================
//  主时间线、静止、跳幕、重播
// =====================================================================
let master = null, freezeTimer = null, FREEZE_AT = Infinity;
const SCENE_START = [];
function freeze(sec) {
  S.frozen = true; master.pause();
  freezeTimer = setTimeout(() => { freezeTimer = null; S.frozen = false; master.resume(); }, sec * 1000);
}
function buildFilm() {
  master = gsap.timeline({ paused: true });
  const scenes = [scene1, scene2, scene3, scene4, scene5, scene6, scene7], allCues = [];
  let off = 0;
  scenes.forEach((fn, i) => {
    CUES = []; const r = fn();
    master.add(r.tl, off); master.addLabel('s' + (i + 1), off); SCENE_START.push(off);
    CUES.forEach(c => allCues.push({ name: c.name, t: off + c.t }));
    off += r.dur;
  });
  master.addLabel('end', off);
  // 卡点时间表（第六幕静止 0.5 秒会让其后的实际时间整体后移 0.5 秒，表中已计入）
  FREEZE_AT = (allCues.find(c => c.name.indexOf('静止') >= 0) || {}).t || Infinity;
  const real = t => t > FREEZE_AT + 1e-6 ? t + .5 : t;
  const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(2).padStart(5, '0')}`;
  console.log('%c《罐底》卡点时间表（全片绝对时间）', 'color:#E8C27A;font-weight:bold;font-size:14px');
  console.table(allCues.map(c => ({ '卡点': c.name, '秒': +real(c.t).toFixed(2), '分:秒': fmt(real(c.t)) })));
  console.log('各幕开始：' + SCENE_START.map((t, i) => `第${i + 1}幕 ${real(t).toFixed(2)}s`).join('  ｜ ') + `  ｜ 全片结束 ${real(off).toFixed(2)}s`);
}
function jump(n) {
  if (!master) return;
  if (freezeTimer) { clearTimeout(freezeTimer); freezeTimer = null; }
  S.frozen = false; clearParticles(); emitters.length = 0; S.amb.acc = 0;
  master.pause(); master.seek(n === 1 ? 0 : 's' + n, true); master.play();
}
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); jump(1); }
  else if (/^[1-7]$/.test(e.key)) { e.preventDefault(); jump(+e.key); }
});

// =====================================================================
//  启动：等字体就绪后立即播放（第一帧已有钩子句，没有黑屏）
// =====================================================================
const FILM_CHARS = '两千多年前，古希腊人讲过一个故事。让你最痛苦的可能不是绝望被误解了神话第幕·文字化为黑雾普罗米修斯偷天火送给类宙大怒决定惩罚他造出女潘拉连同罐子到间打开所有灾难都飞去她慌忙盖上里只剩下后样东西— 赫俄德《工作与时日》二闪电疾病衰老战争饥荒死亡合原根本没盒世纪次译把“”写成三划掉翻错在眼也许礼物它种什么会和装？坏恶因延长尼采性太四引现等待巴胺兴奋程度科学家猴看图案每代表奖励概率然测量们脑结果而半候瘾得说呢期实验经舒尔茨团队五柱猛涨高吗未读明就好更条回消息隔几分钟份早该辞总想着刷视频停来六画面完全静止秒撑走路如直肯离致还七金色光点口底卡（片对）各始：｜红灰通关键词';
requestAnimationFrame(frame);
(async function boot() {
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load('700 64px "Noto Serif SC"', FILM_CHARS),
        document.fonts.load('500 40px "Noto Sans SC"', FILM_CHARS),
        document.fonts.load('500 40px "JetBrains Mono"', '0123456789%:')
      ]).then(() => document.fonts.ready),
      new Promise(r => setTimeout(r, 8000))
    ]);
  } catch (e) { /* 字体加载失败时用系统字体继续 */ }
  buildFilm();
  master.play(0);
})();
</script>
